# Development lint only; the integration is not installed as a Python package.
# Usage: pre-commit run ruff --all-files. The Ruff version is pinned once, in .pre-commit-config.yaml.
[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
# Correctness first; avoid a repository-wide formatting rewrite.
select = ["E4", "E7", "E9", "F", "B", "S", "BLE", "ASYNC", "C90", "PLR0912", "PLR0915", "SIM", "UP", "RUF", "ERA"]
ignore = ["PLR2004"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"tests_ha/**" = ["S101"]

# L2 tests against a real Home Assistant (tests_ha/, quality plan S4); the only place pytest is used.
[tool.pytest.ini_options]
testpaths = ["tests_ha"]
pythonpath = ["."]
asyncio_mode = "auto"
# HA 2026.11 aliases httpx to httpx2 on import and fails if httpx came first; respx's plugin imports httpx and
# entry-point order varies by machine (CI failed, local passed). The tests do not use respx.
addopts = "-p no:respx"

# Type checking (quality plan S8, report only): pyright, basic mode, run by tools/quality.py. Home Assistant is not
# installed in the quality environment, so its imports are unresolved by design and are not counted.
[tool.pyright]
include = ["custom_components", "tools"]
pythonVersion = "3.14"
typeCheckingMode = "basic"
reportMissingImports = "none"
reportMissingModuleSource = "none"
