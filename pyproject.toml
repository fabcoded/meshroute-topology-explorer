# Development lint only; the integration is not installed as a Python package.
# Usage: pre-commit run ruff --all-files. See CONTRIBUTING.md.
[tool.ruff]
target-version = "py313"
required-version = "==0.17.0"

[tool.ruff.lint]
# Correctness first; avoid a repository-wide formatting rewrite.
select = ["E4", "E7", "E9", "F", "B"]
