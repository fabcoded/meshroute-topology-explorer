# SPDX-License-Identifier: MIT
# Checks on every push and pull request: pre-commit (including lint and guard), Python and JavaScript tests.
# Actions are pinned to commit SHAs (tag in the comment); Dependabot proposes updates.
name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
      - run: python3 -m pip install -r requirements-dev.txt
      - run: npm ci --ignore-scripts
      - run: python3 tools/check.py
  smoke:
    # Browser smoke test on the dev page with the runner's Chrome; not a required check yet (quality plan S3).
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - run: python3 -m pip install -r requirements-dev.txt
      - run: python3 tools/smoke.py --chrome "$(command -v google-chrome)"
      - name: Screenshots when the frontend changed
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --depth=1 origin "$BASE"
          git diff --quiet "$BASE" HEAD -- 'custom_components/*/frontend' && exit 0
          python3 tools/screenshots.py --chrome "$(command -v google-chrome)" --out "$RUNNER_TEMP/shots"
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
  hassfest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361  # master (home-assistant/actions has no release tags; pinned by commit)
  hacs:
    # The HACS action validates public repositories only; it starts running once the repository is published.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa  # main as of 2026-06-08 (no release tag at this commit; pinned by commit)
        with:
          category: integration
