# SPDX-License-Identifier: MIT
# Checks on every push and pull request: guard (keys, writes, outside URLs, SPDX), Python and JavaScript tests.
# Actions are pinned to commit SHAs (tag in the comment); Dependabot proposes updates.
name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
      - run: python3 tools/guard.py
      - run: python3 -m unittest discover -s tests -v
      - run: |
          if ls tests/*.test.mjs >/dev/null 2>&1; then node --test "tests/**/*.test.mjs"; else echo "no JavaScript tests yet"; fi
  hassfest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361  # master (home-assistant/actions has no release tags; pinned by commit)
  hacs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa  # 2.0.1 (as given in the brief; verify before merging)
        with:
          category: integration
