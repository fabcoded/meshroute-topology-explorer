# SPDX-License-Identifier: MIT
# Keep Actions and development dependencies current. Hook pins are reviewed with .pre-commit-config.yaml.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
  # Also reads requirements-ha-latest.txt (L2 pins, quality plan S4): a new Home Assistant release arrives as a pull
  # request whose CI runs tests_ha. The minimum, tests_ha/requirements-ha-min.txt, is outside this directory and
  # changes by hand. The three L2 pins move together.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      home-assistant-l2:
        patterns: ["pytest-homeassistant", "home-assistant-frontend", "zigpy"]
