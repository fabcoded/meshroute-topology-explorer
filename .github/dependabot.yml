# SPDX-License-Identifier: MIT
# Keep Actions and development dependencies current. Hook pins are reviewed with .pre-commit-config.yaml.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
  # Reads requirements-ha-latest.txt (L2 pins, quality plan S4). Only pytest-homeassistant triggers a pull request: a
  # new Home Assistant release. The other four L2 pins must equal what that release ships (its manifests for
  # frontend, zha -> zigpy, matter, hassio), but Dependabot would take the newest PyPI release, so they are ignored
  # here and aligned by hand in that pull request's branch, with tests_ha. The minimum,
  # tests_ha/requirements-ha-min.txt, changes by hand and is excluded.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    exclude-paths:
      - "tests_ha/**"
    ignore:
      - dependency-name: "home-assistant-frontend"
      - dependency-name: "zigpy"
      - dependency-name: "matter-python-client"
      - dependency-name: "aiohasupervisor"
