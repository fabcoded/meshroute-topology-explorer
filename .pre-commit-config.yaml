# Run pre-commit install once, then pre-commit run --all-files. See CONTRIBUTING.md.
minimum_pre_commit_version: '4.5.1'
repos:
  - repo: local
    hooks:
      - id: trailing-whitespace
        name: Remove trailing whitespace
        entry: trailing-whitespace-fixer
        language: python
        additional_dependencies: ['pre-commit-hooks==6.0.0']
        types: [text]
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
        name: End files with one newline
        entry: end-of-file-fixer
        language: python
        additional_dependencies: ['pre-commit-hooks==6.0.0']
        types: [text]
      - id: check-merge-conflict
        name: Reject merge markers
        entry: check-merge-conflict
        language: python
        additional_dependencies: ['pre-commit-hooks==6.0.0']
        types: [text]
      - id: check-case-conflict
        name: Reject case-conflicting filenames
        entry: check-case-conflict
        language: python
        additional_dependencies: ['pre-commit-hooks==6.0.0']
      - id: check-added-large-files
        name: Reject accidentally added large files
        entry: check-added-large-files
        language: python
        additional_dependencies: ['pre-commit-hooks==6.0.0']
        args: [--maxkb=1024]
      - id: detect-private-key
        name: Reject private keys
        entry: detect-private-key
        language: python
        additional_dependencies: ['pre-commit-hooks==6.0.0']
        types: [text]
      - id: check-json
        name: Validate JSON
        entry: check-json
        language: python
        additional_dependencies: ['pre-commit-hooks==6.0.0']
        types: [json]
      - id: check-yaml
        name: Validate YAML
        entry: check-yaml
        language: python
        additional_dependencies: ['pre-commit-hooks==6.0.0']
        types: [yaml]
      - id: check-toml
        name: Validate TOML
        entry: check-toml
        language: python
        additional_dependencies: ['pre-commit-hooks==6.0.0']
        types: [toml]
      - id: ruff
        name: Python correctness (Ruff)
        entry: ruff check
        language: python
        additional_dependencies: ['ruff==0.17.0']
        types: [python]
      - id: eslint
        name: JavaScript correctness (ESLint)
        # The script runs only the ESLint in node_modules; a global one ignores eslint.config.mjs.
        entry: npm run --silent lint
        language: system
        pass_filenames: false
        files: '(\.(js|mjs|cjs)$|^package(-lock)?\.json$)'
      - id: complexity
        name: No new function above complexity 15 (tools/complexity.py)
        # Ratchet, owner 2026-11-09 (docs/quality.md "Gates"): above 15 only what tools/complexity-baseline.json lists,
        # never rising. ESLint and sonarjs come from node_modules (node from the system), Ruff as pinned for the ruff hook.
        entry: python tools/complexity.py
        language: python
        additional_dependencies: ['ruff==0.17.0']
        require_serial: true  # one ESLint run for all named files, not one per parallel chunk
        files: '(\.(js|mjs|cjs|py)$|^tools/complexity-baseline\.json$|^eslint\.quality\.config\.mjs$|^package-lock\.json$)'
      - id: bundle-fresh
        name: Panel bundle matches its sources (npm run bundle)
        # frontend/dist/panel.js is what Home Assistant loads (issue #16); a stale copy would ship old code.
        entry: node tools/bundle.mjs --check
        language: system
        pass_filenames: false
        files: '^(custom_components/meshroute_topology_explorer/frontend/|tools/bundle\.mjs$|package(-lock)?\.json$)'
      - id: guard
        name: Meshroute safety and source guard
        entry: python3 tools/guard.py
        language: system
        pass_filenames: false
        always_run: true
