<!doctype html>

<!-- Development page for the panel (not shipped): mounts the real panel element with a fake `hass` whose callWS answers
     from the anonymized sample. No Home Assistant needed; any static server on the repository root will do:
       python3 -m http.server 8823 --bind 127.0.0.1   then open   http://127.0.0.1:8823/dev/panel.html
     The small "dev" tab at the top centre (dev page only) opens a menu of the common variants and toggles. Query keys
     (combine freely):
       inset=<b>|<t>,<b> a system bar of b px at the bottom (and t px on top, default 24) as in the Android app: the root
                       gets --safe-area-inset-*, the panel sits in a container padded as ha-panel-custom does (#4)
       phone=1         the panel in a 390 × 844 frame with the narrow flag, as on a phone
       narrow=1        Home Assistant's narrow flag (default: window narrower than 870 px)
       dark=1          dark theme variables; switchdark=<s>  switch to dark after s seconds; lang=de  sets the
                       locale only: texts stay English; dates and numbers follow it
       nonadmin=1      a user without administrator rights;  nozha=1  ZHA has no config entry;  empty=1  no devices
       error=1         zha/devices fails with a server error
       zhastate=<s>    ZHA's entry is in state s (setup_retry, setup_error: set up, not running); matterstate=<s>
                       the same for Matter (with matter=1)
       lost=<s>        connection lost after s seconds, back after back=<s> more (default 4; back=0 stays lost)
       downfirst=1     the connection is down from the start (comes back after back=<s>)
       variant=minus1|minus3|without-coordinator|coordinator-only   sample with tables removed (spec 12)
       capture=<name>  a real capture from captures/<name>.json (git-ignored, never committed) instead of the sample
                       (a Matter capture, {"responses": {"matter/network_topology": ...}}, shows its Thread network; ZHA from the sample)
       matter=1        the Matter integration loaded, Thread from tests/fixtures/matter-sample.json (the status pill's menu
                       gets the network switch);  matter=notsupported  its topology answers not_supported;
                       matter=borderrouters  tests/fixtures/thread-border-routers.json with Home Assistant's Thread
                       integration: two border routers, one not in the Matter topology (#20)
       network=thread  start on the Thread network (as a stored choice; implies matter=1)
       fill=role|power, density=dense|medium|spread|custom, factor=<0.6-8> (custom), open=on|off ("Details on click"), paths=coordinator|table|all,
       heard=1 (the checkbox "additional heard neighbours", drawn under paths=table only),
       returns=1 ("include return routes" of the view "table"), colors=1 (paths coloured by reception), bad=,
       medium=, good= (own colours as hex without #, e.g. bad=0072b2), labels=type,name,ha (the label lines on)   stored settings to start from
       select=<label>  select a device (as from a finding: no panel opens)
       collapsed=1     with select: as a tap on the map ("Details on click" decides; sheet collapsed on narrow screens)
       left=devices|findings|details, right=view|legend   open a panel on a tab (as its button on the map would)
       debug=1         debug mode;  info=1|reload|all  the density note, the reading note, or every info note in View shown
       scroll=end|theory  scroll the open panel to its end, or to the theoretical-paths card;  hover=<label>  the pointer over that device (its preview)
       version=old     a stale panel version (asks for a reload)
       bundle=1        the shipped bundle frontend/dist/panel.js instead of the source modules (rebuilt by npm run bundle)
       steps=...       replay clicks and keys, log in body[data-log] (see panel-demo.js, replay())
       devmenu=1       open the variant menu at load (for screenshots)
       scan=dialog|run open the scan's confirmation (debug mode), or confirm it too; the fake ZHA then changes the
                       routers' tables one by one, 2 s apart (every fifth stays the same)
       pin=<label>     a stored pin for that device
       dtab=communication|entity|cluster   the Details sub-tab (with select=)
       cluster=0x0006&ep=1&dir=in|out      open that cluster's details; readvalues=1 then reads its attributes
       readfail=error|timeout              the synthetic attribute read fails (sleepy end devices always fail)
       sourceroute=off|assume|zigpy        return paths without a table entry (stored setting); zigpy answers with
                                           synthetic route records (tests/zigpy-fake.mjs)
       history=<name>  the reception history the path history window reads: captures/<name>.json (git-ignored, real), sample
                       (default, tests/fixtures/zha-history-sample.json), none, off (recording off), unsupported; keep=<days>
                       the option "Keep for" (default 90). Records older than a week are shifted so the newest lies 6 h back.
       zigpy=unsupported                   the route records cannot be read (ZHA not loaded) -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel (dev)</title>
  <style>
    /* A stand-in for Home Assistant's default theme variables. */
    :root {
      --primary-background-color: #fafafa; --secondary-background-color: #e5e5e5; --card-background-color: #ffffff;
      --primary-text-color: #212121; --secondary-text-color: #727272; --text-primary-color: #ffffff;
      --divider-color: rgba(0, 0, 0, 0.12); --primary-color: #03a9f4; --warning-color: #ffa600; --error-color: #db4437;
      --app-header-background-color: #03a9f4; --app-header-text-color: #ffffff;
      font-family: Roboto, "Noto Sans", sans-serif;
    }
    :root[data-theme="dark"] {
      --primary-background-color: #111111; --secondary-background-color: #282828; --card-background-color: #1c1c1c;
      --primary-text-color: #e1e1e1; --secondary-text-color: #9b9b9b; --divider-color: rgba(225, 225, 225, 0.12);
      --app-header-background-color: #101e24; --app-header-text-color: #e1e1e1;
    }
    html, body { margin: 0; height: 100%; background: var(--primary-background-color); }
    body:not(.inset) meshroute-topology-explorer { display: block; height: 100%; }
    body.phone { display: flex; align-items: center; justify-content: center; background: #8a8a8a; }
    body.phone meshroute-topology-explorer { width: 390px; height: min(844px, 100vh); flex: none;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.35); }
    /* Variant menu of the dev page (not part of the panel): a small dashed tab at the top centre, clear of the panel's
       buttons in the corners and of both panels. */
    .dev-burger { position: fixed; z-index: 1000; left: 50%; top: 0; transform: translateX(-50%); height: 22px;
      padding: 0 10px; cursor: pointer; font: 11px/20px ui-monospace, monospace; color: var(--secondary-text-color);
      background: var(--card-background-color); border: 1px dashed var(--secondary-text-color); border-top: none;
      border-radius: 0 0 6px 6px; opacity: 0.8; }
    .dev-burger:focus-visible, .dev-menu a:focus-visible, .dev-menu input:focus-visible {
      outline: 2px solid var(--primary-text-color); outline-offset: 2px; }
    .dev-menu { position: fixed; z-index: 1000; left: 50%; transform: translateX(-50%); top: 24px; width: 290px; max-height: calc(100vh - 32px);
      overflow: auto; box-sizing: border-box; padding: 8px 14px 12px; font: 13px/1.4 Roboto, "Noto Sans", sans-serif;
      color: var(--primary-text-color); background: var(--card-background-color); border: 1px solid var(--divider-color);
      border-radius: 8px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3); }
    .dev-menu[hidden] { display: none; }
    .dev-menu h2 { font-size: 15px; margin: 4px 0 8px; }
    .dev-menu h3 { font-size: 12px; margin: 10px 0 2px; color: var(--secondary-text-color); font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.04em; }
    .dev-menu fieldset { border: 1px solid var(--divider-color); border-radius: 6px; margin: 0; padding: 4px 8px 6px; }
    .dev-menu legend { font-size: 12px; color: var(--secondary-text-color); padding: 0 4px; }
    .dev-toggle { display: flex; align-items: center; gap: 8px; min-height: 28px; cursor: pointer; }
    .dev-menu ul { list-style: none; margin: 0; padding: 0; }
    .dev-menu a { display: block; min-height: 26px; line-height: 26px; padding: 0 6px; border-radius: 4px;
      color: inherit; text-decoration: none; }
    .dev-menu a:hover { background: var(--secondary-background-color); }
    .dev-menu a[aria-current] { font-weight: 600; background: var(--secondary-background-color); }
    .dev-mark { color: var(--primary-color); }
  </style>
</head>
<body>
  <meshroute-topology-explorer></meshroute-topology-explorer>
  <script type="module" src="panel-demo.js"></script>
</body>
</html>
